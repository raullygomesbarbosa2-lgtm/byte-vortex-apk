name: Build Byte Vortex Offline
on:
  push:
    paths:
      - .github/workflows/offline.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Extract source
        run: mkdir -p android-app && tar -xzf byte-vortex-offline-v2.tar.gz -C android-app
      - name: Build APK
        run: gradle -p android-app assembleDebug
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android-app/app/build/outputs/apk/debug/app-debug.apk Byte-Vortex-offline.apk
          gh release create offline-v1 Byte-Vortex-offline.apk --title "Byte Vortex Offline" --notes "Aplicativo offline: o catalogo e os arquivos ficam apenas no aparelho. Email de administrador nao verificado; pagamentos nao estao ativos."
