name: Build Byte Vortex Baixar
on:
  push:
    paths:
      - .github/workflows/baixar.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Extract source
        run: mkdir -p android-app && tar -xzf byte-vortex-loja-download.tar.gz -C android-app
      - name: Build APK
        run: gradle -p android-app assembleDebug
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android-app/app/build/outputs/apk/debug/app-debug.apk Byte-Vortex-baixar.apk
          gh release create baixar-v1 Byte-Vortex-baixar.apk --title "Byte Vortex - voltar ao catalogo" --notes "Depois de adicionar arquivo gratuito, o app volta ao catalogo e mostra opcao para baixar. Catalogo local, email nao verificado e pagamentos inativos."
