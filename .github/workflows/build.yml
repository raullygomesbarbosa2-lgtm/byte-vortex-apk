name: Build Byte Vortex APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Extract Android source
        run: mkdir -p android-app && tar -xzf android-source.tar.gz -C android-app
      - name: Build APK
        run: gradle -p android-app assembleDebug
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android-app/app/build/outputs/apk/debug/app-debug.apk Byte-Vortex-demo.apk
          gh release create demo-v1 Byte-Vortex-demo.apk --title "Byte Vortex - demonstracao" --notes "APK de demonstracao. Jogos de exemplo; compras e uploads nao estao ativados."
