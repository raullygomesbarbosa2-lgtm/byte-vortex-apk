name: Build Byte Vortex Trono
on:
  push:
    paths:
      - .github/workflows/trono.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Extract source
        run: mkdir -p android-app && tar -xzf byte-vortex-trono-icon.tar.gz -C android-app
      - name: Build APK
        run: gradle -p android-app assembleDebug
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android-app/app/build/outputs/apk/debug/app-debug.apk Byte-Vortex-trono.apk
          gh release create trono-v1 Byte-Vortex-trono.apk --title "Byte Vortex - trono e icone" --notes "Imagem do trono como fundo e imagem dos consoles como icone. Aplicativo offline, catalogo local, email nao verificado e pagamentos inativos."
